# Built-in defaults, overridden by the user config referenced via TINYHPC_CONFIG.
schema = 1

[paths]
home = "/opt/tinyhpc"
root = "/opt/hpc"

[build]
jobs = 4
profile = "native"

[mirrors]
gnu = [
  "https://ftp.gnu.org/gnu/",
  "https://ftp.unicamp.br/pub/gnu/",
  "https://gnu.c3sl.ufpr.br/ftp/",
]
