schema = 1

[package]
name = "gmp"
version = "6.1.0"
description = "GNU Multiple Precision Arithmetic Library 6.1.0"
dependencies = []

[source]
url = "https://ftp.gnu.org/gnu/gmp/gmp-6.1.0.tar.bz2"
sha256 = "498449a994efeba527885c10405993427995d3f86b8768d8cdf8d9dd7c6b73e8"
directory = "gmp-6.1.0"

[build]
system = "autotools"
arguments = []

[build.environment]
CC = "gcc"
CFLAGS = "-std=gnu17"

[module]
root_environment = ["GMP_ROOT"]

[module.paths]
LD_LIBRARY_PATH = ["lib"]
LIBRARY_PATH = ["lib"]
CPATH = ["include"]
PKG_CONFIG_PATH = ["lib/pkgconfig"]

[[tests]]
type = "file"
path = "include/gmp.h"

[[tests]]
type = "file"
path = "lib/libgmp.so"
