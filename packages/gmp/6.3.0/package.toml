schema = 1

[package]
name = "gmp"
version = "6.3.0"
description = "GNU Multiple Precision Arithmetic Library 6.3.0"
dependencies = []

[source]
url = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.bz2"
sha256 = "ac28211a7cfb609bae2e2c8d6058d66c8fe96434f740cf6fe2e47b000d1c20cb"
directory = "gmp-6.3.0"

[build]
system = "autotools"
arguments = []

[build.environment]
# Use the system compiler with C17 so the host GCC (not a toolchain) builds GMP.
CC = "gcc"
CFLAGS = "-std=gnu17"

[module]
root_environment = ["GMP_ROOT"]

[module.paths]
LD_LIBRARY_PATH = ["lib"]
LIBRARY_PATH = ["lib"]
CPATH = ["include"]
PKG_CONFIG_PATH = ["lib/pkgconfig"]

[[tests]]
type = "file"
path = "include/gmp.h"

[[tests]]
type = "file"
path = "lib/libgmp.so"
