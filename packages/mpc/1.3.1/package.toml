schema = 1

[package]
name = "mpc"
version = "1.3.1"
description = "GNU MPC 1.3.1"
dependencies = ["gmp/6.3.0", "mpfr/4.2.2"]

[source]
mirror = "gnu"
path = "mpc/mpc-1.3.1.tar.gz"
sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"
directory = "mpc-1.3.1"

[build]
system = "autotools"
# Build against the just-installed GMP/MPFR prefixes.
arguments = ["--with-gmp=${GMP_ROOT}", "--with-mpfr=${MPFR_ROOT}"]

[build.environment]
# Avoid injecting MPFR 4.2 into the host GCC's own cc1 process.
LD_LIBRARY_PATH = "${TINYHPC_HOST_LD_LIBRARY_PATH}"

[module]
root_environment = ["MPC_ROOT"]

[module.paths]
LD_LIBRARY_PATH = ["lib"]
LIBRARY_PATH = ["lib"]
CPATH = ["include"]
PKG_CONFIG_PATH = ["lib/pkgconfig"]

[[tests]]
type = "file"
path = "include/mpc.h"

[[tests]]
type = "file"
path = "lib/libmpc.so"
