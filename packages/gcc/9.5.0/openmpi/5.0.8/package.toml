schema = 1

[package]
name = "openmpi"
version = "5.0.8"
description = "Open MPI 5.0.8 built with GCC 9.5.0"
dependencies = []

[source]
url = "https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.8.tar.bz2"
sha256 = "53131e1a57e7270f645707f8b0b65ba56048f5b5ac3f68faabed3eb0d710e449"
directory = "openmpi-5.0.8"

[build]
system = "autotools"
# Disable usempif08 to keep this Open MPI build compatible with GCC 9 and
# optimize the remaining C/C++/Fortran interfaces for the build host. Pin
# PMIx to the bundled copy so a host PMIx (e.g. a newer Spack build) cannot
# leak in and break the bundled PRRTE.
arguments = [
  "--with-pmix=internal",
  "--disable-mpi-fortran-usempif08",
  "CFLAGS=${HPC_OPT_FLAGS}",
  "CXXFLAGS=${HPC_OPT_FLAGS}",
  "FCFLAGS=${HPC_OPT_FLAGS}",
]

[module]
family = "mpi"
root_environment = ["MPI_ROOT"]

[module.paths]
PATH = ["bin"]
LD_LIBRARY_PATH = ["lib"]
LIBRARY_PATH = ["lib"]
CPATH = ["include"]
MANPATH = ["share/man"]
PKG_CONFIG_PATH = ["lib/pkgconfig"]

[[tests]]
type = "executable"
path = "bin/mpirun"

[[tests]]
type = "executable"
path = "bin/mpifort"

[[tests]]
type = "script"
path = "smoke-test.sh"
