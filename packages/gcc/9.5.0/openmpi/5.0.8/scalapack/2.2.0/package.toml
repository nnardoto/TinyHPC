schema = 1

[package]
name = "scalapack"
version = "2.2.0"
description = "ScaLAPACK 2.2.0 with Open MPI 5.0.8 and OpenBLAS 0.3.30"
dependencies = ["openblas/0.3.30"]

[source]
url = "https://github.com/Reference-ScaLAPACK/scalapack/archive/refs/tags/v2.2.0.tar.gz"
archive = "scalapack-2.2.0.tar.gz"
sha256 = "8862fc9673acf5f87a474aaa71cd74ae27e9bbeee475dbd7292cec5b8bcbdcf3"
directory = "scalapack-2.2.0"

[build]
system = "cmake"
requires = ["cmake"]
# BUILD_SHARED_LIBS plus explicit BLAS/LAPACK libs yield a shared library; the
# policy minimum lets newer CMake configure this older project. Embedded
# rpaths make OpenBLAS/MPI resolvable at runtime.
arguments = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DCMAKE_C_FLAGS_RELEASE=${HPC_OPT_FLAGS}",
  "-DCMAKE_Fortran_FLAGS_RELEASE=${HPC_OPT_FLAGS}",
  "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
  "-DCMAKE_C_COMPILER=${MPI_ROOT}/bin/mpicc",
  "-DCMAKE_Fortran_COMPILER=${MPI_ROOT}/bin/mpifort",
  "-DMPI_C_COMPILER=${MPI_ROOT}/bin/mpicc",
  "-DMPI_Fortran_COMPILER=${MPI_ROOT}/bin/mpifort",
  "-DBUILD_SHARED_LIBS=ON",
  "-DSCALAPACK_BUILD_TESTS=OFF",
  "-DBLAS_LIBRARIES=${OPENBLAS_ROOT}/lib/libopenblas.so",
  "-DLAPACK_LIBRARIES=${OPENBLAS_ROOT}/lib/libopenblas.so",
  "-DLAPACK_FOUND=TRUE",
  "-DCMAKE_INSTALL_RPATH=${OPENBLAS_ROOT}/lib;${MPI_ROOT}/lib;${GCC_ROOT}/lib64;${GCC_ROOT}/lib",
]

[build.environment]
# The system cmake is a C++ binary that must load the host libstdc++, not the
# toolchain's older one (which lacks recent GLIBCXX symbols). Reset
# LD_LIBRARY_PATH and embed rpaths instead, so cmake runs and the compiled
# test programs still resolve the toolchain/MPI/OpenBLAS libraries.
LD_LIBRARY_PATH = "${TINYHPC_HOST_LD_LIBRARY_PATH}"
LDFLAGS = "-Wl,-rpath,${GCC_ROOT}/lib64 -Wl,-rpath,${GCC_ROOT}/lib -Wl,-rpath,${MPI_ROOT}/lib -Wl,-rpath,${OPENBLAS_ROOT}/lib"

[module]
root_environment = ["SCALAPACK_ROOT"]

[module.paths]
LD_LIBRARY_PATH = ["lib"]
LIBRARY_PATH = ["lib"]
PKG_CONFIG_PATH = ["lib/pkgconfig"]

[[tests]]
type = "file"
path = "lib/libscalapack.so"

[[tests]]
type = "script"
path = "smoke-test.sh"
