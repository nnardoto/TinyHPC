schema = 1

[package]
name = "openblas"
version = "0.3.30"
description = "OpenBLAS 0.3.30 optimized for GCC 16.2.0"
dependencies = []

[source]
url = "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.30/OpenBLAS-0.3.30.tar.gz"
sha256 = "27342cff518646afb4c2b976d809102e368957974c250a25ccc965e53063c95d"
directory = "OpenBLAS-0.3.30"

[build]
system = "make"
# Detect and tune for the build CPU. BLAS stays sequential so MPI/OpenMP
# applications do not create a nested thread pool.
arguments = [
  "CC=${CC}",
  "FC=${FC}",
  "HOSTCC=${CC}",
  "DYNAMIC_ARCH=${HPC_OPENBLAS_DYNAMIC_ARCH}",
  "COMMON_OPT=${HPC_OPT_FLAGS}",
  "USE_THREAD=0",
  "USE_OPENMP=0",
  "NO_AFFINITY=1",
  "LDFLAGS=-Wl,-rpath,${GCC_ROOT}/lib64 -Wl,-rpath,${GCC_ROOT}/lib",
]
install_arguments = ["PREFIX={prefix}"]

[module]
root_environment = ["OPENBLAS_ROOT", "BLAS_ROOT", "LAPACK_ROOT"]

[module.environment]
OPENBLAS_NUM_THREADS = "1"

[module.paths]
LD_LIBRARY_PATH = ["lib"]
LIBRARY_PATH = ["lib"]
CPATH = ["include"]
PKG_CONFIG_PATH = ["lib/pkgconfig"]

[[tests]]
type = "file"
path = "lib/libopenblas.so"

[[tests]]
type = "directory"
path = "include"

[[tests]]
type = "script"
path = "smoke-test.sh"
