schema = 1

[package]
name = "gcc"
version = "16.2.0"
description = "GNU Compiler Collection 16.2.0"
dependencies = ["gmp/6.3.0", "mpfr/4.2.2", "mpc/1.3.1", "isl/0.24"]

[source]
url = "https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"
directory = "gcc-16.2.0"

[build]
system = "autotools"
# Skip the three-stage bootstrap for speed and drop multilib/libsanitizer
# while retaining ISL-backed Graphite loop optimizations.
arguments = [
  "--enable-languages=c,c++,fortran",
  "--disable-multilib",
  "--disable-bootstrap",
  "--disable-libsanitizer",
  "--with-gmp=${GMP_ROOT}",
  "--with-mpfr=${MPFR_ROOT}",
  "--with-mpc=${MPC_ROOT}",
  "--with-isl=${ISL_ROOT}",
]

[build.environment]
# Keep the host GCC from loading this toolchain's MPFR into cc1.
LD_LIBRARY_PATH = "${TINYHPC_HOST_LD_LIBRARY_PATH}"
# Embed rpaths so GCC's internal executables resolve their support libraries.
LDFLAGS = "-Wl,-rpath,${ISL_ROOT}/lib -Wl,-rpath,${MPC_ROOT}/lib -Wl,-rpath,${MPFR_ROOT}/lib -Wl,-rpath,${GMP_ROOT}/lib"

[module]
family = "compiler"
root_environment = ["GCC_ROOT"]

[module.paths]
PATH = ["bin"]
LD_LIBRARY_PATH = ["lib64", "lib"]
LIBRARY_PATH = ["lib64", "lib"]
CPATH = ["include"]
MANPATH = ["share/man"]

[module.environment]
CC = "{root}/bin/gcc"
CXX = "{root}/bin/g++"
FC = "{root}/bin/gfortran"

[[tests]]
type = "executable"
path = "bin/gcc"

[[tests]]
type = "executable"
path = "bin/gfortran"
