schema = 1

[package]
name = "mpfr"
version = "4.2.2"
description = "GNU MPFR 4.2.2"
dependencies = ["gmp/6.3.0"]

[source]
mirror = "gnu"
path = "mpfr/mpfr-4.2.2.tar.bz2"
sha256 = "9ad62c7dc910303cd384ff8f1f4767a655124980bb6d8650fe62c815a231bb7b"
directory = "mpfr-4.2.2"

[build]
system = "autotools"
# Build against the just-installed GMP prefix.
arguments = ["--with-gmp=${GMP_ROOT}"]

[module]
root_environment = ["MPFR_ROOT"]

[module.paths]
LD_LIBRARY_PATH = ["lib"]
LIBRARY_PATH = ["lib"]
CPATH = ["include"]
PKG_CONFIG_PATH = ["lib/pkgconfig"]

[[tests]]
type = "file"
path = "include/mpfr.h"

[[tests]]
type = "file"
path = "lib/libmpfr.so"
